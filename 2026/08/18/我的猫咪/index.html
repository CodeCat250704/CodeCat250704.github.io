<!-- 引入动态水波与水花溅出特效 -->
<!-- ======================================================= -->
<style>
  /* 水波纹容器 - 覆盖全屏 */
  #ripple-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none; /* 让鼠标事件穿透过去，不影响点击博客本身 */
    z-index: 9999;
    overflow: hidden;
  }

  /* 单个水花粒子的样式 */
  .ripple-particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transform: translate(-50%, -50%) scale(0);
    animation: rippleEffect 1s ease-out forwards;
    pointer-events: none;
  }

  /* 鼠标移动的流光微光 */
  .glow-follow {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: all 0.1s linear;
    pointer-events: none;
  }

  /* 水花溅出的动画定义 */
  @keyframes rippleEffect {
    0% {
      transform: translate(-50%, -50%) scale(0);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -50%) scale(4);
      opacity: 0;
    }
  }
</style>

<!-- 挂载节点 -->
<div id="ripple-container">
  <div class="glow-follow" id="mouseGlow"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('ripple-container');
    const glow = document.getElementById('mouseGlow');

    // 1. 鼠标移动：产生淡淡的流光跟随
    document.addEventListener('mousemove', function(e) {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    // 2. 鼠标点击（无论是左键、右键、中键）：产生水花溅出
    document.addEventListener('mousedown', function(e) {
      // 创建 6 个随机方向的粒子，模拟水花
      for (let i = 0; i < 6; i++) {
        const particle = document.createElement('div');
        particle.className = 'ripple-particle';
        
        // 随机大小 15px ~ 40px
        const size = Math.random() * 25 + 15;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = e.clientX + 'px';
        particle.style.top = e.clientY + 'px';

        // 随机颜色（半透明白+微弱彩色）
        const hue = Math.random() * 360;
        particle.style.background = `hsla(${hue}, 80%, 80%, 0.4)`;

        // 随机方向偏移
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 40 + 20;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 10; // 稍微向上飘

        // 注入自定义动画
        particle.style.animation = `rippleEffect 0.8s ease-out forwards`;
        particle.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`;

        container.appendChild(particle);

        // 动画结束后自动移除节点，防止卡顿
        setTimeout(() => {
          particle.remove();
        }, 800);
      }
    });
  });
</script>
<!-- ======================================================= -->

<!-- 菜单点击360度翻转特效 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // 找到所有侧边栏的菜单按钮
  const menuItems = document.querySelectorAll('.menu-item a');
  
  menuItems.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      // 移除其他按钮可能残留的动画类
      document.querySelectorAll('.menu-item a.flip-active').forEach(function(el) {
        el.classList.remove('flip-active');
      });
      
      // 给当前点击的按钮加上触发类
      btn.classList.add('flip-active');
      
      // 动画结束后移除类（方便下次点击）
      setTimeout(() => {
        btn.classList.remove('flip-active');
      }, 800);
    });
  });
});
</script>

<style>
/* 翻转动画核心 CSS */
.menu-item a {
  transition: all 0.3s ease !important;
  backface-visibility: hidden !important;
}

.menu-item a.flip-active {
  animation: flip360 0.7s cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards !important;
}

@keyframes flip360 {
  0% {
    transform: rotateY(0deg) scale(1);
    background: rgba(255, 255, 255, 0.05);
  }
  50% {
    transform: rotateY(180deg) scale(1.15);
    background: rgba(0, 150, 255, 0.4);
    border-color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.6);
  }
  100% {
    transform: rotateY(360deg) scale(1);
    background: rgba(255, 255, 255, 0.08);
  }
}
</style>
